name: build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux-android:
    name: Linux x64 and Android arm64 (Ubuntu 20.04 container)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      CC: clang
      CXX: clang++
    defaults:
      run:
        working-directory: app
    steps:
      - name: Install native build dependencies
        working-directory: /
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates clang cmake curl git ninja-build \
            pkg-config unzip xz-utils zip libgtk-3-dev liblzma-dev libomp-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache native dependency builds
        uses: actions/cache@v4
        with:
          path: |
            app/native/ocr/.build-deps
            app/native/ocr/vendor
          key: ocr-ubuntu20-${{ hashFiles('app/native/ocr/scripts/**', 'app/native/ocr/CMakeLists.txt') }}

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build static Linux OCR dependencies
        run: native/ocr/scripts/build_deps_unix.sh linux-x64

      - name: Build Linux release
        run: flutter build linux --release

      - name: Verify Linux OCR bundle
        run: |
          test -f build/linux/x64/release/bundle/lib/libzh_ocr.so
          test -f build/linux/x64/release/bundle/data/flutter_assets/assets/ocr/PP_OCRv6_small_rec.bin
          if ldd build/linux/x64/release/bundle/lib/libzh_ocr.so | grep -E 'opencv|ncnn'; then
            echo "OpenCV or ncnn was linked dynamically" >&2
            exit 1
          fi

      - name: Build static Android OCR dependencies
        run: native/ocr/scripts/build_deps_unix.sh android-arm64-v8a

      - name: Build Android arm64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify and package artifacts
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'lib/arm64-v8a/libzh_ocr.so'
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/zh-lang-textbook-android-arm64.apk
          tar -czf release/zh-lang-textbook-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android
          path: app/release/*
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache native dependency builds
        uses: actions/cache@v4
        with:
          path: |
            app/native/ocr/.build-deps
            app/native/ocr/vendor
          key: ocr-windows-${{ hashFiles('app/native/ocr/scripts/**', 'app/native/ocr/CMakeLists.txt') }}

      - name: Build static OCR dependencies
        shell: pwsh
        run: ./native/ocr/scripts/build_deps_windows.ps1

      - name: Get dependencies and build
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release

      - name: Verify and package artifact
        shell: pwsh
        run: |
          $Bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$Bundle/zh_ocr.dll")) { throw "zh_ocr.dll is missing" }
          if (-not (Test-Path "$Bundle/data/flutter_assets/assets/ocr/PP_OCRv6_small_rec.bin")) { throw "OCR models are missing" }
          $UnexpectedDlls = Get-ChildItem $Bundle -Recurse -File | Where-Object { $_.Name -match '^(opencv|ncnn).*\.dll$' }
          if ($UnexpectedDlls) { throw "OpenCV or ncnn was linked dynamically: $($UnexpectedDlls.Name -join ', ')" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "$Bundle/*" -DestinationPath release/zh-lang-textbook-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/release/*
          if-no-files-found: error

  build-apple:
    name: macOS and unsigned iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install build dependencies
        run: brew install cmake ninja

      - name: Cache native dependency builds
        uses: actions/cache@v4
        with:
          path: |
            app/native/ocr/.build-deps
            app/native/ocr/vendor
          key: ocr-apple-${{ runner.arch }}-${{ hashFiles('app/native/ocr/scripts/**', 'app/native/ocr/CMakeLists.txt') }}

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build static macOS dependencies and OCR dylib
        run: |
          native/ocr/scripts/build_deps_unix.sh "macos-$(uname -m)"
          cmake -S native/ocr -B native/ocr/build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZH_OCR_USE_OPENMP=OFF \
            -DZH_OCR_VENDOR_ROOT="$PWD/native/ocr/vendor/macos-$(uname -m)"
          cmake --build native/ocr/build-macos --parallel

      - name: Build and package macOS app
        run: |
          flutter build macos --release
          mac_app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$mac_app"
          mkdir -p "$mac_app/Contents/Frameworks" release
          cp native/ocr/build-macos/libzh_ocr.dylib "$mac_app/Contents/Frameworks/"
          test -n "$(find "$mac_app" -path '*/flutter_assets/assets/ocr/PP_OCRv6_small_rec.bin' -print -quit)"
          if otool -L "$mac_app/Contents/Frameworks/libzh_ocr.dylib" | grep -E 'opencv|ncnn'; then
            echo "OpenCV or ncnn was linked dynamically" >&2
            exit 1
          fi
          codesign --force --deep --sign - "$mac_app"
          ditto -c -k --sequesterRsrc --keepParent "$mac_app" release/zh-lang-textbook-macos-${{ runner.arch }}.zip

      - name: Build static iOS dependencies and combined OCR archive
        run: |
          native/ocr/scripts/build_deps_unix.sh ios-arm64
          cmake -S native/ocr -B native/ocr/build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DZH_OCR_LIBRARY_TYPE=STATIC \
            -DZH_OCR_USE_OPENMP=OFF \
            -DZH_OCR_VENDOR_ROOT="$PWD/native/ocr/vendor/ios-arm64"
          cmake --build native/ocr/build-ios --parallel
          libtool -static -o native/ocr/build-ios/libzh_ocr_all.a \
            native/ocr/build-ios/libzh_ocr.a \
            $(find native/ocr/vendor/ios-arm64 -name '*.a' -type f)

      - name: Build and package unsigned iOS app
        run: |
          flutter build ios --release --no-codesign
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep '_zh_ocr_create'
          test -n "$(find build/ios/iphoneos/Runner.app -path '*/flutter_assets/assets/ocr/PP_OCRv6_small_rec.bin' -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            release/zh-lang-textbook-ios-arm64-unsigned.zip

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple
          path: app/release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux-android
      - build-windows
      - build-apple
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**
