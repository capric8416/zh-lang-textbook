name: build native - Android arm64

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        working-directory: app
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Install native build dependencies
        working-directory: /
        run: |
          sed -i -e 's|https://archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' -e 's|https://security.ubuntu.com/ubuntu|http://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=10 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=10 install -y build-essential ca-certificates clang curl git jq ninja-build pkg-config unzip xz-utils zip libasound2-dev libgtk-3-dev liblzma-dev libomp-dev
      - uses: actions/checkout@v4
      - name: Setup mise, Python, uv and CMake
        run: |
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          mise use -g python@latest
          mise use -g uv@latest
          mise use -g cmake@3.31.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build and publish archive
        run: bash ../.github/scripts/build_native_archive.sh android-arm64-v8a
