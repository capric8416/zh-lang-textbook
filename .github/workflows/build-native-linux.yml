name: build native - Linux x64

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        working-directory: app
    env:
      CC: gcc-11
      CXX: g++-11
    steps:
      - name: Install native build dependencies
        working-directory: /
        run: |
          sed -i -e 's|https://archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' -e 's|https://security.ubuntu.com/ubuntu|http://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=10 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=10 install -y ca-certificates software-properties-common
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get -o Acquire::Retries=10 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=10 install -y build-essential gcc-11 g++-11 curl git jq ninja-build pkg-config unzip xz-utils zip libasound2-dev libgtk-3-dev liblzma-dev libomp-dev
          "$CC" --version
          "$CXX" --version
          printf '#include <span>\nint main() { int value = 0; std::span<int> items(&value, 1); return items[0]; }\n' | "$CXX" -std=c++20 -x c++ -fsyntax-only -
      - uses: actions/checkout@v4
      - name: Setup mise, Python, uv and CMake
        run: |
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          mise use -g python@latest
          mise use -g uv@latest
          mise use -g cmake@3.31.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - name: Build and publish archive
        env:
          VERIFY_SPEECH_BRIDGE: "1"
        run: bash ../.github/scripts/build_native_archive.sh linux-x64
