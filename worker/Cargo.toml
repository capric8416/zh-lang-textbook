[package]
name = "zh-lang-textbook-accounts-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.105"
worker = { version = "0.6", features = ["d1"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
