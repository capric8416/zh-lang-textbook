[project]
name = "zh-textbook-parser"
version = "0.1.0"
description = "小学语文课本 PDF 排版块解析与语义单元抽取"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "pymupdf>=1.28.0",
    "pypinyin>=0.55.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
zh-textbook = "zh_textbook_parser.cli:main"
zh-polyphone = "zh_textbook_parser.polyphone:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zh_textbook_parser"]
